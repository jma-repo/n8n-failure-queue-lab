name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests scripts
      - name: Workflows are what the definitions build
        run: uv run python scripts/build_workflows.py --check
      - name: JavaScript tests (validator, alerts, compile check of every Code node)
        run: node --test "tests/js/*.test.js"
      - name: Python tests (store, API, source, RCA, workflows, runbook)
        run: uv run pytest

  e2e:
    name: End-to-end on the compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.6"
          enable-cache: true
      - name: Install
        run: uv sync --frozen
      - name: Start the stack and set n8n up
        run: |
          uv run lab init
          docker compose up -d --build --wait
          uv run lab bootstrap
      - name: End-to-end tests
        run: uv run lab e2e
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
