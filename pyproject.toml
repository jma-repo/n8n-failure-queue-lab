[project]
name = "n8n-failure-queue-lab"
version = "0.1.0"
description = "n8n workflow with a DuckDB failure queue, backoff retries, alerts and SQL root-cause analysis, plus a runbook"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "James Ma" }]
dependencies = [
    "duckdb>=1.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
lab = "lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
shots = [
    "playwright>=1.45",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["e2e: needs the docker compose stack (run with `lab e2e`)"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
